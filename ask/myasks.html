<script>
const stage = document.getElementById('stage');
let currentFilter = 'all'; // all | sent | received
let currentPage = 1;
const PAGE_SIZE = 10;

function render() {
  trackEvent('ask_myasks_viewed', { total: loadMyAsks().length });
  renderList();
}

function filteredList() {
  const list = loadMyAsks();
  if (currentFilter === 'sent') return list.filter(i => i.role === 'sent');
  if (currentFilter === 'received') return list.filter(i => i.role === 'received');
  return list;
}

function itemLabel(item) {
  if (item.role === 'sent' && item.status === 'pending') {
    return { icon: '📮', title: `내가 보낸 질문 ${item.questions.length}개`, status: '답변 기다리는 중', statusClass: 'pending' };
  }
  if (item.role === 'sent' && item.status === 'done') {
    const name = item.otherName || '친구';
    return { icon: '📨', title: `${escapeHtml(name)}님의 답변`, status: timeAgo(item.updatedAt), statusClass: '' };
  }
  const name = item.otherName || '친구';
  return { icon: '📬', title: `${escapeHtml(name)}님에게 보낸 답변`, status: timeAgo(item.updatedAt), statusClass: '' };
}

function timeAgo(ms) {
  const diff = Date.now() - ms;
  const min = Math.floor(diff / 60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour}시간 전`;
  const day = Math.floor(hour / 24);
  if (day < 7) return `${day}일 전`;
  const d = new Date(ms);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}

function renderList() {
  const list = filteredList();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  stage.innerHTML = `
    <div class="masthead" style="margin-bottom:24px;">
      <div class="kicker">💬 Ask</div>
      <h1 style="font-size:24px;">내 ASK함</h1>
      <p class="sub" style="font-style:normal;">주고받은 질문들을 모아두고, 답이 오면 확인하세요</p>
    </div>

    <div class="ask-filter-row">
      <div class="ask-filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">전체</div>
      <div class="ask-filter-btn ${currentFilter === 'sent' ? 'active' : ''}" onclick="setFilter('sent')">보낸 ASK</div>
      <div class="ask-filter-btn ${currentFilter === 'received' ? 'active' : ''}" onclick="setFilter('received')">받은 ASK</div>
    </div>

    <div id="askList"></div>
  `;

  const listEl = document.getElementById('askList');
  if (pageItems.length === 0) {
    listEl.innerHTML = `<div class="ask-empty">아직 주고받은 Ask가 없어요.<br>Ask를 보내거나 받으면 여기 모여요.</div>`;
    return;
  }

  listEl.innerHTML = pageItems.map(item => {
    const label = itemLabel(item);
    return `
      <div class="ask-item" onclick="${item.status === 'done' ? `openResult('${item.id}')` : `reopenPending('${item.id}')`}">
        <div class="ask-item-icon">${label.icon}</div>
        <div class="ask-item-body">
          <div class="ask-item-title">${label.title}</div>
          <div class="ask-item-status ${label.statusClass}">${label.status}</div>
        </div>
      </div>
    `;
  }).join('');

  if (totalPages > 1) {
    let pagBtns = '';
    for (let p = 1; p <= totalPages; p++) {
      pagBtns += `<button class="ask-page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
    }
    listEl.insertAdjacentHTML('beforeend', `<div class="ask-pagination">${pagBtns}</div>`);
  }
}

function setFilter(f) { currentFilter = f; currentPage = 1; renderList(); }
function goPage(p) { currentPage = p; renderList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function reopenPending(id) {
  const list = loadMyAsks();
  const entry = list.find(i => i.id === id);
  if (!entry) { toast('찾을 수 없어요.'); return; }
  trackEvent('ask_myasks_pending_reopened', {});

  // 요청 생성 시점과 동일한 payload를 그대로 재구성 — 결정적(deterministic)
  // 인코딩이라 원래 보냈던 링크와 정확히 같은 링크가 다시 만들어진다.
  const payload = { id: entry.id, questions: entry.questions, from: entry.myName || '', createdAt: entry.createdAt };
  const encoded = encodeData(payload);
  const url = `${window.location.origin}${window.location.pathname.replace('myasks.html', 'answer.html')}?q=${encoded}`;

  stage.innerHTML = `
    <button class="ghost-btn" style="margin-bottom:20px;" onclick="renderList()">← 목록으로</button>
    <div class="share-result">
      <div class="env-icon">💬</div>
      <h2>답변 기다리는 중이에요</h2>
      <p>친구에게 링크를 다시 전달해보세요.</p>
      <button class="seal-btn" onclick="shareLink('${url}')">지금 바로 공유하기</button>
    </div>
  `;
}

function openResult(id) {
  const list = loadMyAsks();
  const entry = list.find(i => i.id === id);
  if (!entry) { toast('찾을 수 없어요.'); return; }
  const isRequester = entry.role === 'sent';
  trackEvent('ask_myasks_item_opened', { role: entry.role });
  stage.innerHTML = `
    <button class="ghost-btn" style="margin-bottom:20px;" onclick="renderList()">← 목록으로</button>
    ${renderAskResultBlock(entry, isRequester)}
  `;
}

render();
</script>
