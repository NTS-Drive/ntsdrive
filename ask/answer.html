<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17140F">
<title>Ask 답변하기 | NTS Drive</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Serif+KR:ital,wght@0,500;0,700;1,500&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1785376802">
<script src="../analytics.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="../inapp-warning.js?v=1785291827"></script>
</head>
<body>

<div class="stage" id="stage" style="padding-top:40px;"></div>

<div class="toast" id="toast"></div>

<script src="shared.js?v=1785376802"></script>
<script>
const stage = document.getElementById('stage');
let requestPayload = null;

function render() {
  const params = new URLSearchParams(window.location.search);
  if (!params.has('q')) {
    stage.innerHTML = `<div class="share-result"><div class="env-icon">💬</div><h2>Ask 링크가 필요해요</h2><p>친구에게 받은 링크로 접속해주세요.</p></div>`;
    return;
  }
  try {
    requestPayload = decodeData(params.get('q'));
  } catch (e) {
    stage.innerHTML = `<div class="share-result"><div class="env-icon">💬</div><h2>링크를 읽을 수 없어요</h2><p>링크가 손상되었을 수 있어요.</p></div>`;
    return;
  }
  trackEvent('ask_answer_viewed', { question_count: requestPayload.questions.length });
  renderAnswerForm();
}

function renderAnswerForm() {
  const senderLabel = requestPayload.from ? `${escapeHtml(requestPayload.from)}님이` : '친구가';
  stage.innerHTML = `
    <div class="masthead" style="margin-bottom:28px;">
      <div class="kicker">💬 Ask</div>
      <h1>${senderLabel} ${requestPayload.questions.length}가지<br>질문을 보냈어요</h1>
    </div>
    <div id="answerCards">
      ${requestPayload.questions.map((q, i) => `
        <div class="ask-answer-card" id="answerCard${i}">
          <div class="qnum">Q${i + 1}</div>
          <div class="qtext">${escapeHtml(q)}</div>
          <input type="text" id="answerInput${i}" maxlength="${ASK_A_MAX}" placeholder="답을 입력해주세요"
            oninput="onAnswerInput(${i})" onfocus="setActiveCard(${i})" onblur="setActiveCard(-1)"
            oncompositionstart="askComposeStart('a${i}')"
            oncompositionend="askComposeEnd(this, ${ASK_A_MAX}, 'a${i}', () => onAnswerInput(${i}))">
          <div class="charcount" id="answerCount${i}">0/${ASK_A_MAX}</div>
        </div>
      `).join('')}
    </div>
    <div class="field" style="margin-top:20px;">
      <label>내 이름 (선택)</label>
      <input type="text" id="myName" maxlength="${ASK_NAME_MAX}" placeholder="이름을 입력하세요">
    </div>
    <button class="seal-btn" id="askAnswerSubmitBtn" onclick="handleSubmitAnswer()" disabled>답장 보내기</button>
  `;
  updateSubmitState();
}

function setActiveCard(i) {
  document.querySelectorAll('.ask-answer-card').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });
}

function onAnswerInput(i) {
  const input = document.getElementById(`answerInput${i}`);
  const countEl = document.getElementById(`answerCount${i}`);
  if (!askComposingKeys.has('a' + i) && input.value.length > ASK_A_MAX) {
    input.value = input.value.slice(0, ASK_A_MAX);
    toast(`최대 ${ASK_A_MAX}자까지 입력할 수 있어요.`);
  }
  countEl.textContent = `${input.value.length}/${ASK_A_MAX}`;
  updateSubmitState();
}

function updateSubmitState() {
  const btn = document.getElementById('askAnswerSubmitBtn');
  if (!btn) return;
  const allFilled = requestPayload.questions.every((_, i) => {
    const input = document.getElementById(`answerInput${i}`);
    return input && input.value.trim().length > 0;
  });
  btn.disabled = !allFilled;
}

function handleSubmitAnswer() {
  const answers = requestPayload.questions.map((_, i) => document.getElementById(`answerInput${i}`).value.trim().slice(0, ASK_A_MAX));
  if (answers.some(a => !a)) { toast('모든 질문에 답해주세요.'); return; }

  const myName = document.getElementById('myName').value.trim().slice(0, ASK_NAME_MAX);

  saveReceivedDone(requestPayload.id, requestPayload.questions, answers, requestPayload.from, myName);
  trackEvent('ask_answered', { question_count: requestPayload.questions.length });

  const replyPayload = {
    id: requestPayload.id,
    questions: requestPayload.questions,
    answers,
    from: requestPayload.from || '',
    replyFrom: myName,
    createdAt: requestPayload.createdAt
  };
  const encoded = encodeData(replyPayload);
  const url = `${window.location.origin}${window.location.pathname.replace('answer.html', 'index.html')}?a=${encoded}`;
  renderShareResult(url, { questions: requestPayload.questions, answers, otherName: requestPayload.from || '' });
}

function renderShareResult(url, resultEntry) {
  stage.innerHTML = `
    <div class="share-result">
      <div class="env-icon">💬</div>
      <h2>답장이 완성됐어요</h2>
      <p>아래 버튼으로 답을 전달해주세요.</p>
      <button class="seal-btn" onclick="shareLink('${url}')">지금 바로 보내기</button>
      <p class="disclaimer" style="margin-top:16px;">이 답변은 이미 <b>내 ASK함</b>에도 저장해뒀어요.</p>
      <button class="ghost-btn" style="width:100%; margin-top:12px; margin-bottom:26px;" onclick="showMyOwnAnswers()">내 답변 다시 보기</button>
    </div>
    <div id="myAnswersView"></div>
  `;
  window._askResultEntry = resultEntry;
}

function showMyOwnAnswers() {
  const entry = window._askResultEntry;
  document.getElementById('myAnswersView').innerHTML = renderAskResultBlock(entry, false);
}

render();
</script>
</body>
</html>
