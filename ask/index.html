<script>
const stage = document.getElementById('stage');
let selectedPoolIds = new Set();
let customQuestions = []; // { localId, text }
let customChecked = new Set(); // localIds
let activeTab = ASK_CATEGORIES[0];
let customLocalSeq = 1;

function totalSelectedCount() {
  const customFilled = customQuestions.filter(q => customChecked.has(q.localId) && q.text.trim().length > 0).length;
  return selectedPoolIds.size + customFilled;
}

function renderPicker() {
  trackEvent('ask_picker_viewed', {});
  stage.innerHTML = `
    <div class="masthead" style="margin-bottom:10px;">
      <div class="kicker">💬 Ask</div>
      <h1>물어보고 싶은 걸<br>골라주세요</h1>
    </div>
    <div class="ask-counter">3~10개까지 고를 수 있어요 (지금 <b id="askCount">0</b>/10)</div>

    <div class="ask-tabbar" id="askTabbar"></div>
    <div id="askTabContent"></div>

    <div class="field" style="margin-top:30px;">
      <label>보낸 사람 이름 (선택)</label>
      <input type="text" id="fromName" maxlength="${ASK_NAME_MAX}" placeholder="이름을 입력하세요">
    </div>

    <button class="seal-btn" id="askSubmitBtn" onclick="handleCreateAsk()">Ask 요청 보내기</button>
  `;
  renderTabbar();
  renderTabContent();
  updateCounter();
}

function renderTabbar() {
  const tabs = [...ASK_CATEGORIES, '＋나만의 질문'];
  const el = document.getElementById('askTabbar');
  el.innerHTML = tabs.map(tab => {
    const count = tab === '＋나만의 질문'
      ? customQuestions.filter(q => customChecked.has(q.localId) && q.text.trim().length > 0).length
      : ASK_QUESTION_POOL.filter(q => q.cat === tab && selectedPoolIds.has(q.id)).length;
    return `<div class="ask-tab ${activeTab === tab ? 'active' : ''}" onclick="switchTab('${tab}')">${tab}${count > 0 ? `<span class="badge">${count}</span>` : ''}</div>`;
  }).join('');
}

function switchTab(tab) {
  activeTab = tab;
  renderTabbar();
  renderTabContent();
}

function renderTabContent() {
  const el = document.getElementById('askTabContent');
  if (activeTab === '＋나만의 질문') {
    if (customQuestions.length === 0) {
      el.innerHTML = `
        <div class="ask-custom-empty">아직 추가한 질문이 없어요</div>
        <button type="button" class="ask-custom-add-btn" onclick="addCustomQuestion()">+ 질문 추가하기</button>
      `;
      return;
    }
    el.innerHTML = customQuestions.map(q => `
      <div class="ask-custom-row ${customChecked.has(q.localId) ? 'checked' : ''}">
        <div class="ask-qrow-radio" onclick="toggleCustomCheck(${q.localId})">${customChecked.has(q.localId) ? '✓' : ''}</div>
        <input type="text" value="${escapeAttr(q.text)}" maxlength="${ASK_Q_MAX}" placeholder="질문을 입력하세요"
          oninput="updateCustomText(${q.localId}, this.value)"
          oncompositionstart="askComposeStart('cq${q.localId}')"
          oncompositionend="askComposeEnd(this, ${ASK_Q_MAX}, 'cq${q.localId}', () => updateCustomText(${q.localId}, this.value))">
        <span class="ask-custom-del" onclick="deleteCustomQuestion(${q.localId})">삭제</span>
      </div>
    `).join('') + `<button type="button" class="ask-custom-add-btn" onclick="addCustomQuestion()">+ 질문 추가하기</button>`;
    return;
  }
  const list = ASK_QUESTION_POOL.filter(q => q.cat === activeTab);
  el.innerHTML = list.map(q => `
    <div class="ask-qrow ${selectedPoolIds.has(q.id) ? 'checked' : ''}" onclick="togglePoolQuestion(${q.id})">
      <div class="ask-qrow-radio">${selectedPoolIds.has(q.id) ? '✓' : ''}</div>
      <div class="ask-qrow-text">${escapeHtml(q.text)}</div>
    </div>
  `).join('');
}

function togglePoolQuestion(id) {
  if (selectedPoolIds.has(id)) {
    selectedPoolIds.delete(id);
  } else {
    if (totalSelectedCount() >= ASK_MAX) { toast(`최대 ${ASK_MAX}개까지만 고를 수 있어요.`); return; }
    selectedPoolIds.add(id);
  }
  renderTabbar();
  renderTabContent();
  updateCounter();
}

function addCustomQuestion() {
  if (totalSelectedCount() >= ASK_MAX) { toast(`최대 ${ASK_MAX}개까지만 고를 수 있어요.`); return; }
  const localId = customLocalSeq++;
  customQuestions.push({ localId, text: '' });
  customChecked.add(localId); // 추가 즉시 선택 완료 상태
  renderTabbar();
  renderTabContent();
  updateCounter();
}

function updateCustomText(localId, value) {
  const q = customQuestions.find(q => q.localId === localId);
  if (!q) return;
  if (!askComposingKeys.has('cq' + localId) && value.length > ASK_Q_MAX) {
    value = value.slice(0, ASK_Q_MAX);
    toast(`최대 ${ASK_Q_MAX}자까지 입력할 수 있어요.`);
  }
  q.text = value;
  renderTabbar();
  updateCounter();
}

function toggleCustomCheck(localId) {
  if (customChecked.has(localId)) {
    customChecked.delete(localId);
  } else {
    if (totalSelectedCount() >= ASK_MAX) { toast(`최대 ${ASK_MAX}개까지만 고를 수 있어요.`); return; }
    customChecked.add(localId);
  }
  renderTabbar();
  renderTabContent();
  updateCounter();
}

function deleteCustomQuestion(localId) {
  customQuestions = customQuestions.filter(q => q.localId !== localId);
  customChecked.delete(localId);
  renderTabbar();
  renderTabContent();
  updateCounter();
}

function updateCounter() {
  const el = document.getElementById('askCount');
  if (el) el.textContent = totalSelectedCount();
  const btn = document.getElementById('askSubmitBtn');
  if (btn) btn.disabled = totalSelectedCount() < ASK_MIN;
}

function handleCreateAsk() {
  const poolTexts = ASK_QUESTION_POOL.filter(q => selectedPoolIds.has(q.id)).map(q => q.text);
  const customTexts = customQuestions.filter(q => customChecked.has(q.localId) && q.text.trim().length > 0).map(q => q.text.trim().slice(0, ASK_Q_MAX));
  const questions = [...poolTexts, ...customTexts];

  if (questions.length < ASK_MIN) { toast(`최소 ${ASK_MIN}개는 골라주세요.`); return; }
  if (questions.length > ASK_MAX) { toast(`최대 ${ASK_MAX}개까지만 고를 수 있어요.`); return; }

  const fromName = document.getElementById('fromName').value.trim().slice(0, ASK_NAME_MAX);
  const id = randomId();
  const createdAt = Date.now();
  const payload = { id, questions, from: fromName, createdAt };
  const encoded = encodeData(payload);
  const url = `${window.location.origin}${window.location.pathname.replace('index.html', 'answer.html')}?q=${encoded}`;

  trackEvent('ask_created', { question_count: questions.length });
  saveSentPending(id, questions, fromName, createdAt);
  renderShareResult(url);
}

function renderShareResult(url) {
  stage.innerHTML = `
    <div class="share-result">
      <div class="env-icon">💬</div>
      <h2>Ask가 만들어졌어요</h2>
      <p>아래 버튼으로 친구에게 링크를 전달해서<br>답을 받아보세요.</p>
      <button class="seal-btn" onclick="shareLink('${url}')">지금 바로 공유하기</button>
      <p class="disclaimer" style="margin-top:16px;">이 Ask는 이미 <b>내 ASK함</b>에 저장해뒀어요.<br>답이 오면 자동으로 채워져요.</p>
      <button class="ghost-btn" style="width:100%; margin-top:20px;" onclick="navigate('myasks.html')">확인했어요, 내 ASK함으로 갈게요</button>
    </div>
  `;
  // Post/Log와 동일한 패턴: 사용자 클릭 체인 안에서 동기적으로 호출해야
  // navigator.share()가 브라우저 정책에 막히지 않는다.
  if (navigator.share) {
    shareLink(url);
  }
}

/* ===== 진입: 회신 링크(?a=)로 들어온 경우 결과 화면(③) 표시, 아니면 질문 선택 화면 ===== */
function render() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('a')) {
    let replyPayload;
    try { replyPayload = decodeData(params.get('a')); }
    catch (e) {
      stage.innerHTML = `<div class="share-result"><div class="env-icon">💬</div><h2>링크를 읽을 수 없어요</h2><p>링크가 손상되었을 수 있어요.</p></div>`;
      return;
    }
    const entry = completeSentAsk(replyPayload);
    trackEvent('ask_reply_viewed', { question_count: replyPayload.questions.length });
    stage.innerHTML = renderAskResultBlock(entry, true);
    return;
  }
  renderPicker();
}
render();
</script>
