<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min — product builder</title>
<meta name="description" content="Min — a product builder who plans and builds services with AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:ital@1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css?v=1789726804">
<script src="analytics.js"></script>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <h1 class="sw-heading">Selected<br>work</h1>

    <div class="intro-box">
      <p class="intro-name">Min</p>
      <p class="intro-tagline">Product builder crafting services with AI</p>
    </div>

    <div class="controls-row">
      <div class="status-toggle" role="group" aria-label="Filter by status">
        <button type="button" class="status-btn is-active" data-status="all">All</button>
        <button type="button" class="status-btn" data-status="live">Live</button>
        <button type="button" class="status-btn" data-status="demo">Demo</button>
      </div>
      <div class="filter-dropdown">
        <button type="button" class="filter-btn" id="filter-btn" aria-haspopup="true" aria-expanded="false">
          Sort: <span id="filter-btn-label">Newest</span>
          <i class="ti ti-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="filter-menu" id="filter-menu">
          <button type="button" class="filter-option is-active" data-sort="newest">Newest</button>
          <button type="button" class="filter-option" data-sort="az">A&ndash;Z</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="projects" id="projects" aria-label="Project list">
      <!-- Rows are rendered by script.js from data/projects.json -->
    </section>

    <p class="next-slot">More projects coming.</p>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Min &middot; <a href="mailto:myer@kakao.com" class="footer-email">myer@kakao.com</a></p>
  </footer>

</div>

<script src="script.js?v=1789726804"></script>
</body>
</html>
