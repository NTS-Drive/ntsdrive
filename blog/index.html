<script>
  fetch('posts-index.json')
    .then(r => r.json())
    .then(posts => {
      const el = document.getElementById('blogList');
      if (!posts || posts.length === 0) {
        el.innerHTML = '<div class="blog-empty">곧 이야기를 들려드릴게요.</div>';
        return;
      }
      const sorted = posts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      el.innerHTML = sorted.map(p => `
        <a class="blog-card" onclick="navigate('post.html?slug=${p.slug}')">
          <div class="blog-date">${p.date}</div>
          <h3>${p.title}</h3>
          <p>${p.excerpt || ''}</p>
        </a>
      `).join('');
    })
    .catch(() => {
      document.getElementById('blogList').innerHTML = '<div class="blog-empty">곧 이야기를 들려드릴게요.</div>';
    });
</script>
