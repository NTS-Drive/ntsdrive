<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const contentEl = document.getElementById('blogPostContent');

  if (!slug) {
    contentEl.innerHTML = '<div class="blog-empty">글을 찾을 수 없어요.</div>';
  } else {
    fetch('posts-index.json')
      .then(r => r.json())
      .then(posts => {
        const sorted = posts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
        const idx = sorted.findIndex(p => p.slug === slug);
        const meta = sorted[idx];
        if (!meta) {
          contentEl.innerHTML = '<div class="blog-empty">글을 찾을 수 없어요.</div>';
          return;
        }
        document.title = `${meta.title} | NTS Drive`;
        fetch(`posts/${slug}.md`)
          .then(r => r.text())
          .then(md => {
            const html = (typeof marked !== 'undefined') ? marked.parse(md) : md;
            const prev = sorted[idx + 1];
            const next = sorted[idx - 1];
            contentEl.innerHTML = `
              <div class="blog-post-meta">${meta.date}</div>
              <h1 class="blog-post-title">${meta.title}</h1>
              <div class="blog-post-body">${html}</div>
              <div class="blog-post-nav">
                <span>${prev ? `<a onclick="navigate('post.html?slug=${prev.slug}')">← ${prev.title}</a>` : ''}</span>
                <span>${next ? `<a onclick="navigate('post.html?slug=${next.slug}')">${next.title} →</a>` : ''}</span>
              </div>
            `;
          })
          .catch(() => { contentEl.innerHTML = '<div class="blog-empty">글을 불러오지 못했어요.</div>'; });
      })
      .catch(() => { contentEl.innerHTML = '<div class="blog-empty">글을 불러오지 못했어요.</div>'; });
  }
</script>
